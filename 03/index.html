<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Array de Linguagens</title>

    <script>
        let linguagens = Array();

        linguagens[0] = 'Dart';
        linguagens[1] = 'PHP';
        linguagens[2] = 'Java';
        linguagens[3] = 'Python';
        linguagens[4] = 'Perl';
        linguagens[5] = 'Ruby on Rails';
        linguagens[6] = 'C ++';

        function mostrarListaLinguagens() {
            const container = document.getElementById('minhaDiv');

            for (var i = 0; i < linguagens.length; i++) {

                var tag = '<h5>' + i + ' - ' + linguagens[i] + '</h5>';

                container.innerHTML += tag;
            }
        }

        function posicaoLinguagens() {
            var indice = prompt('Qual posição da lista deseja consultar?');

            alert(linguagens[indice]);
        }
    </script>
</head>

<body>

    <h1>Array de Linguagens</h1>

    <button onclick="mostrarListaLinguagens()">
        Criar Array
    </button>

    <br><br>

    <button onclick="posicaoLinguagens()">
        Posição no Array
    </button>

    <div id="minhaDiv"></div>

</body>
</html>

<script>

    let frutas = Array();

    frutas[0] = 'maçã';
    frutas[1] = 'banana';
    frutas[2] = 'laranja';
    frutas[3] = 'melancia';
    frutas[4] = 'manga';

    function mostrarListaFrutas() {

        const container = document.getElementById('minhaDiv');

        for (var i = 0; i < frutas.length; i++) {

            var tag = '<h5>' + i + ' - ' + frutas[i] + '</h5>';

            container.innerHTML += tag;
        }
    }

    function posicaoFrutas() {

        var indice = prompt('Qual posição da lista deseja consultar?');

        alert(frutas[indice]);
    }

</script>

<body>

    <h1>Array de Frutas</h1>

    <button onclick="mostrarListaFrutas()">
        Criar Array
    </button>

    <br><br>

    <button onclick="posicaoFrutas()">
        Posição no Array
    </button>

    <div id="minhaDiv"></div>

</body>
