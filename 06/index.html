<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Cursos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Cadastro de Cursos</h2>

    <!-- Formulário -->
    <div class="card p-4 mb-4">

        <form id="formCurso">

            <input type="hidden" id="indiceEdicao" value="-1">

            <div class="mb-3">
                <label class="form-label">Nome do Curso</label>
                <input type="text" id="nome" class="form-control" placeholder="Digite o nome do curso" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Professor</label>
                <input type="text" id="professor" class="form-control" placeholder="Digite o nome do professor" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Carga Horária</label>
                <input type="number" id="carga" class="form-control" placeholder="Ex: 40" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Modalidade</label>
                <select id="modalidade" class="form-select">
                    <option value="Presencial">Presencial</option>
                    <option value="Online">Online</option>
                    <option value="Híbrido">Híbrido</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" id="btnSalvar">
                Salvar Curso
            </button>

            <button type="reset" class="btn btn-secondary" onclick="limparFormulario()">
                Limpar
            </button>

        </form>
    </div>

    <!-- Tabela -->
    <div class="card p-3">

        <h4 class="mb-3">Lista de Cursos</h4>

        <div class="table-responsive">
            <table class="table table-striped table-bordered text-center">

                <thead class="table-dark">
                    <tr>
                        <th>Curso</th>
                        <th>Professor</th>
                        <th>Carga Horária</th>
                        <th>Modalidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaCorpo"></tbody>

            </table>
        </div>
    </div>

</div>

<script>

let cursos = [];

let indiceEdicao = -1;

// Mostrar lista
function mostrarLista() {

    let tabela = document.getElementById("tabelaCorpo");

    tabela.innerHTML = "";

    cursos.forEach((curso, indice) => {

        tabela.innerHTML += `
            <tr>
                <td>${curso.nome}</td>
                <td>${curso.professor}</td>
                <td>${curso.carga} horas</td>
                <td>${curso.modalidade}</td>

                <td>
                    <button class="btn btn-warning btn-sm"
                    onclick="editarCurso(${indice})">
                        Editar
                    </button>

                    <button class="btn btn-danger btn-sm"
                    onclick="removerCurso(${indice})">
                        Remover
                    </button>
                </td>
            </tr>
        `;
    });
}

// Salvar curso
function salvar() {

    let nome = document.getElementById("nome").value;
    let professor = document.getElementById("professor").value;
    let carga = document.getElementById("carga").value;
    let modalidade = document.getElementById("modalidade").value;

    let curso = {
        nome: nome,
        professor: professor,
        carga: carga,
        modalidade: modalidade
    };

    if (indiceEdicao === -1) {

        cursos.push(curso);

    } else {

        cursos[indiceEdicao] = curso;

        indiceEdicao = -1;

        document.getElementById("btnSalvar").innerText = "Salvar Curso";
    }

    mostrarLista();

    document.getElementById("formCurso").reset();
}

// Editar curso
function editarCurso(indice) {

    let curso = cursos[indice];

    document.getElementById("nome").value = curso.nome;
    document.getElementById("professor").value = curso.professor;
    document.getElementById("carga").value = curso.carga;
    document.getElementById("modalidade").value = curso.modalidade;

    indiceEdicao = indice;

    document.getElementById("btnSalvar").innerText = "Atualizar Curso";
}

// Remover curso
function removerCurso(indice) {

    if (confirm("Deseja realmente remover este curso?")) {

        cursos.splice(indice, 1);

        mostrarLista();
    }
}

// Limpar formulário
function limparFormulario() {

    indiceEdicao = -1;

    document.getElementById("btnSalvar").innerText = "Salvar Curso";
}

// Evento do formulário
document.getElementById("formCurso").addEventListener("submit", function(event) {

    event.preventDefault();

    salvar();

});

</script>

</body>
</html>
